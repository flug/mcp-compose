name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Run tests
      run: go test -v ./...

    - name: Build
      run: |
        GOOS=linux GOARCH=amd64 go build -o mcp-compose-linux-amd64
        GOOS=linux GOARCH=arm64 go build -o mcp-compose-linux-arm64
        GOOS=darwin GOARCH=amd64 go build -o mcp-compose-darwin-amd64
        GOOS=darwin GOARCH=arm64 go build -o mcp-compose-darwin-arm64
        GOOS=windows GOARCH=amd64 go build -o mcp-compose-windows-amd64.exe
        GOOS=windows GOARCH=arm64 go build -o mcp-compose-windows-arm64.exe

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          mcp-compose-*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
